name: Build Crash Analyzer APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.34
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Bootstrap and repair Python-for-Android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROIDSDK: /usr/local/lib/android/sdk
        run: |
          rm -rf .buildozer
          set +e
          yes | buildozer android debug
          FIRST_STATUS=$?
          set -e
          echo "Initial Buildozer bootstrap status: $FIRST_STATUS"

          P4A=".buildozer/android/platform/python-for-android"
          if [ ! -d "$P4A" ]; then
            echo "Buildozer did not create python-for-android at $P4A"
            find .buildozer/android/platform -maxdepth 3 -type d -print 2>/dev/null || true
            exit 1
          fi

          echo "Repairing p4a source and temporary build virtualenvs"

          # The failed bootstrap can leave a partially upgraded pip inside
          # p4a's temporary venv. Remove those venvs so p4a recreates them
          # cleanly on the final build.
          find .buildozer/android/platform -type d -path "*/build/venv" -prune -exec rm -rf {} + 2>/dev/null || true
          find .buildozer/android/platform -type d -path "*/build/hostpython/venv" -prune -exec rm -rf {} + 2>/dev/null || true

          # Keep the Python 3 recipe aligned with the Android host Python.
          grep -RIl '3\.14\.2' "$P4A/pythonforandroid/recipes" 2>/dev/null | xargs -r sed -i 's/3\.14\.2/3.11.9/g'

          # Older p4a/buildozer combinations work more reliably with pip 23.2.1.
          grep -RIl '24\.3\.1' "$P4A/pythonforandroid" 2>/dev/null | xargs -r sed -i 's/24\.3\.1/23.2.1/g'
          grep -RIl 'pip install -U pip' "$P4A/pythonforandroid" 2>/dev/null | xargs -r sed -i 's/pip install -U pip/true/g'
          grep -RIl 'pip install --force-reinstall --no-cache-dir pip==24\.3\.1' "$P4A/pythonforandroid" 2>/dev/null | xargs -r sed -i 's/pip install --force-reinstall --no-cache-dir pip==24\.3\.1/true/g'
          grep -RIl 'venv/bin/pip install Cython' "$P4A/pythonforandroid" 2>/dev/null | xargs -r sed -i 's#venv/bin/pip install Cython#venv/bin/python -m ensurepip --upgrade \&\& venv/bin/python -m pip install Cython#g'

          echo "Remaining temporary venvs:"
          find .buildozer/android/platform -type d -path "*/build/venv" -print 2>/dev/null || true
          echo "Python recipe versions:"
          grep -RIn 'version = .*3\.1[14]' "$P4A/pythonforandroid/recipes/hostpython3" "$P4A/pythonforandroid/recipes/python3" 2>/dev/null || true

      - name: Build Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROIDSDK: /usr/local/lib/android/sdk
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crash-analyzer-debug-apk
          path: bin/*.apk
          if-no-files-found: error
