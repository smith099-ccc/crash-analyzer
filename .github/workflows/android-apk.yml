name: Build Crash Analyzer APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.34
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Bootstrap and repair Python-for-Android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROIDSDK: /usr/local/lib/android/sdk
        run: |
          rm -rf .buildozer
          set +e
          yes | buildozer android debug
          FIRST_STATUS=$?
          set -e
          echo "Initial Buildozer bootstrap status: $FIRST_STATUS"

          P4A=".buildozer/android/platform/python-for-android"
          # Use the current p4a develop fixes for the pip/venv corruption affecting
          # recent GitHub Actions runners. The upstream Buildozer docs recommend
          # the develop branch for current Android builds.
          if [ -d "$P4A" ]; then
            cd "$P4A"
            git fetch --depth=1 origin develop
            git checkout -B develop FETCH_HEAD
            cd -
          fi
          if [ ! -d "$P4A" ]; then
            echo "Buildozer did not create python-for-android at $P4A"
            find .buildozer/android/platform -maxdepth 3 -type d -print 2>/dev/null || true
            exit 1
          fi

          echo "Repairing p4a source and temporary build virtualenvs"

          for VENV in $(find .buildozer/android/platform -type d -path "*/build/venv" -print 2>/dev/null); do
            if [ -x "$VENV/bin/python" ]; then
              "$VENV/bin/python" -m ensurepip --upgrade || true
              "$VENV/bin/python" -m pip install --force-reinstall "pip==23.2.1" "setuptools<70" wheel || true
            fi
          done
          for VENV in $(find .buildozer/android/platform -type d -path "*/build/hostpython/venv" -print 2>/dev/null); do
            if [ -x "$VENV/bin/python" ]; then
              "$VENV/bin/python" -m ensurepip --upgrade || true
              "$VENV/bin/python" -m pip install --force-reinstall "pip==23.2.1" "setuptools<70" wheel || true
            fi
          done

          grep -RIl '3\.14\.2' "$P4A/pythonforandroid/recipes" 2>/dev/null | xargs -r sed -i 's/3\.14\.2/3.11.9/g'

          # The current p4a develop source can still invoke "pip install -U pip" directly.
          # Replace that call too, because a mixed pip installation can fail before our venv repair runs.
          grep -RIl 'source venv/bin/activate && pip install -U pip' "$P4A/pythonforandroid" 2>/dev/null | while read -r FILE; do
            sed -i 's#source venv/bin/activate && pip install -U pip#rm -rf venv/lib/python*/site-packages/pip venv/lib/python*/site-packages/pip-* \\&\\& venv/bin/python -m ensurepip --upgrade \\&\\& venv/bin/python -m pip install --force-reinstall pip==23.2.1#g' "$FILE"
          done

          # p4a's generated build venv can contain a mixed/broken pip installation.
          # Clean pip completely before bootstrapping it, then pin pip 23.2.1.
          grep -RIl 'venv/bin/python -m ensurepip --upgrade && venv/bin/python -m pip install --force-reinstall pip==23\.2\.1 && venv/bin/python -m pip install Cython' "$P4A/pythonforandroid" 2>/dev/null | xargs -r sed -i 's#venv/bin/python -m ensurepip --upgrade && venv/bin/python -m pip install --force-reinstall pip==23.2.1 && venv/bin/python -m pip install Cython#rm -rf venv/lib/python*/site-packages/pip venv/lib/python*/site-packages/pip-* \\&\\& venv/bin/python -m ensurepip --upgrade \\&\\& venv/bin/python -m pip install --force-reinstall pip==23.2.1 \\&\\& venv/bin/python -m pip install Cython#g'

          # Fallback for older p4a source variants.
          grep -RIl 'venv/bin/pip install Cython' "$P4A/pythonforandroid" 2>/dev/null | xargs -r sed -i 's#venv/bin/pip install Cython#rm -rf venv/lib/python*/site-packages/pip venv/lib/python*/site-packages/pip-* \&\& venv/bin/python -m ensurepip --upgrade \&\& venv/bin/python -m pip install --force-reinstall pip==23.2.1 \&\& venv/bin/python -m pip install Cython#g'

          # Final guard against p4a upgrading pip to an incompatible latest release.
          grep -RIl 'pip install -U pip' "$P4A/pythonforandroid" 2>/dev/null | while read -r FILE; do
            sed -i 's/pip install -U pip/pip install --force-reinstall pip==23.2.1/g' "$FILE"
          done

          echo "Remaining temporary venvs:"
          find .buildozer/android/platform -type d -path "*/build/venv" -print 2>/dev/null || true
          echo "Python recipe versions:"
          grep -RIn 'version = .*3\.1[14]' "$P4A/pythonforandroid/recipes/hostpython3" "$P4A/pythonforandroid/recipes/python3" 2>/dev/null || true

      - name: Build Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROIDSDK: /usr/local/lib/android/sdk
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crash-analyzer-debug-apk
          path: bin/*.apk
          if-no-files-found: error
