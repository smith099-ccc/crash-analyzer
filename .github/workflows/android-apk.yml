name: Build Crash Analyzer APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.34

      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Bootstrap and repair p4a
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROIDSDK: /usr/local/lib/android/sdk
        run: |
          rm -rf .buildozer
          set +e
          yes | buildozer android debug
          FIRST_STATUS=$?
          set -e
          echo "Initial bootstrap status: $FIRST_STATUS"

          P4A=".buildozer/android/platform/python-for-android"
          if [ ! -d "$P4A" ]; then
            echo "python-for-android directory was not created"
            exit 1
          fi

          cd "$P4A"
          git fetch --depth=1 origin develop
          git checkout -B develop FETCH_HEAD
          cd -

          BUILD_PY="$P4A/pythonforandroid/build.py"
          if [ -f "$BUILD_PY" ]; then
            python - "$BUILD_PY" <<'PY'
import pathlib
import sys

path = pathlib.Path(sys.argv[1])
text = path.read_text()

# Keep the replacement inside the existing Python string literal. Do not
# inject shell syntax into the Python source itself.
replacements = [
    ("pip install -U pip",
     "python -m ensurepip --upgrade && python -m pip install --force-reinstall pip==23.2.1"),
    ("pip install --upgrade pip",
     "python -m ensurepip --upgrade && python -m pip install --force-reinstall pip==23.2.1"),
]

changed = False
for old, new in replacements:
    if old in text:
        text = text.replace(old, new)
        changed = True

if changed:
    path.write_text(text)
    print("Patched p4a build.py pip bootstrap safely.")
else:
    print("No p4a pip-upgrade command matched.")

# Patch only the known incompatible Python 3.14.2 recipe pins if present.
for root in [
    path.parent.parent / "recipes" / "hostpython3",
    path.parent.parent / "recipes" / "python3",
]:
    if root.exists():
        for recipe in root.rglob("*.py"):
            s = recipe.read_text()
            if "3.14.2" in s:
                recipe.write_text(s.replace("3.14.2", "3.11.9"))
                print("Patched Python recipe:", recipe)
PY
          fi

          # The failed bootstrap may have left a half-installed venv.
          # Delete it so the next Buildozer invocation creates it cleanly
          # using the patched p4a bootstrap command.
          find .buildozer/android/platform -type d -path "*/build/venv" -prune -exec rm -rf {} + 2>/dev/null || true

          echo "p4a repair complete"

      - name: Build Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROIDSDK: /usr/local/lib/android/sdk
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crash-analyzer-debug-apk
          path: bin/*.apk
          if-no-files-found: error
