name: Build Crash Analyzer APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             git zip unzip autoconf automake libtool pkg-config             zlib1g-dev libncurses5-dev libncursesw5-dev             cmake libffi-dev libssl-dev libltdl-dev             build-essential

      - name: Install Buildozer and Python-for-Android dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install git+https://github.com/kivy/buildozer.git
          python -m pip install legacy-cgi setuptools cython==0.29.34

      - name: Validate project
        run: |
          python -m py_compile main.py crash_analyzer.py android_feed.py run_feed.py
          python - <<'PY'
          from crash_analyzer import RollingAnalyzer, parse_multipliers
          values = parse_multipliers("1.35x 1.47x 2.10x 1.10x")
          assert values == [1.35, 1.47, 2.10, 1.10]
          a = RollingAnalyzer()
          a.add_values(values)
          result = a.analyze()
          assert result.sample_size == 4
          assert result.target_hits == 2
          assert result.below_target == 1
          assert result.above_target == 1
          print("Analyzer validation passed.")
          PY

      - name: Bootstrap and repair python-for-android pip
        env:
          BUILDOZER_ALLOW_ORG_TEST_DOMAIN: "1"
        run: |
          # Let Buildozer download/bootstrap python-for-android and create its build tree.
          set +e
          yes | buildozer android debug
          BOOTSTRAP_STATUS=$?
          set -e
          echo "Initial Buildozer status: $BOOTSTRAP_STATUS"

          P4A=".buildozer/android/platform/python-for-android"
          test -d "$P4A"
          BUILD_PY="$P4A/pythonforandroid/build.py"
          test -f "$BUILD_PY"

          # Avoid upgrading pip to a version that leaves an inconsistent package
          # inside p4a's temporary build venv.
          python - "$BUILD_PY" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          replacements = (
              ("pip install -U pip",
               "python -m ensurepip --upgrade && python -m pip install --force-reinstall pip==23.2.1"),
              ("pip install --upgrade pip",
               "python -m ensurepip --upgrade && python -m pip install --force-reinstall pip==23.2.1"),
          )
          changed = False
          for old, new in replacements:
              if old in source:
                  source = source.replace(old, new)
                  changed = True
          if not changed and "pip==23.2.1" not in source:
              raise SystemExit("Could not locate p4a pip-upgrade command; refusing an unpatched build.")
          path.write_text(source)
          print("python-for-android pip bootstrap patched.")
          PY

          # Remove the partially-created venv so the patched command starts cleanly.
          find .buildozer/android/platform -type d -path "*/build/venv" -prune -exec rm -rf {} + 2>/dev/null || true

      - name: Build Android APK
        env:
          BUILDOZER_ALLOW_ORG_TEST_DOMAIN: "1"
        run: |
          yes | buildozer android debug

      - name: Verify APK
        run: |
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          ls -lh bin/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: crash-analyzer-debug-apk
          path: bin/*.apk
          if-no-files-found: error
